<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PowerBridge Global — HR Portal</title>
<style>
  :root{--navy:#0B1B3D;--navy-deep:#071228;--gold:#F5B921;--gold-deep:#C98F00;
    --text:#1F2937;--muted:#8A93A6;--line:#E4E8F1;--bg:#F4F6FB;--ok:#1E7A38;--bad:#B42318;--warn:#B45F06;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Segoe UI',Inter,Arial,sans-serif;color:var(--text);}
  .topbar{background:var(--navy);color:#fff;}
  .topbar-inner{max-width:1000px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand-wrap{display:flex;align-items:center;gap:12px;}
  .topbar img{width:38px;height:38px;border-radius:50%;}
  .brand{font-weight:800;letter-spacing:.4px;font-size:14px;}
  .sub{font-size:10.5px;color:var(--gold);font-weight:600;letter-spacing:.6px;}
  .whoami{display:flex;align-items:center;gap:10px;font-size:12px;}
  .badge{background:rgba(255,255,255,.12);padding:5px 11px;border-radius:20px;font-weight:700;}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;padding:9px 16px;border-radius:9px;border:none;cursor:pointer;}
  .btn-primary{background:var(--gold);color:var(--navy-deep);box-shadow:0 3px 10px rgba(245,185,33,.3);}
  .btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
  .btn-ghost{background:transparent;color:#B9C2D9;border:none;font-size:11px;cursor:pointer;}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-bad{background:#fff;color:var(--bad);border:1.5px solid #F3C9C4;}
  .btn:disabled{opacity:.45;cursor:default;}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 20px 60px;}
  .card{background:#fff;border-radius:14px;border:1px solid var(--line);padding:20px;margin-bottom:16px;}
  .card h3{margin:0 0 4px;color:var(--navy);font-size:16px;}
  .card .csub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  label.fl{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:5px;}
  input,select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1.5px solid #DDE2ED;font-size:13.5px;box-sizing:border-box;outline:none;font-family:inherit;background:#fff;}
  textarea{min-height:60px;resize:vertical;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .row-gap{margin-top:12px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tab{padding:9px 15px;border-radius:9px;font-size:12.5px;font-weight:700;background:#fff;color:var(--navy);border:1.5px solid var(--line);cursor:pointer;}
  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;padding:8px 10px;border-bottom:2px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid #EEF1F7;vertical-align:top;}
  .pill{display:inline-block;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;}
  .pill.pending{background:#FFF4E0;color:var(--warn);}
  .pill.approved{background:#EAF7EE;color:var(--ok);}
  .pill.declined{background:#FDECEC;color:var(--bad);}
  .pill.l2{background:#E7F0FF;color:#1D4ED8;}
  .msg{padding:9px 12px;border-radius:8px;font-size:12.5px;margin-top:10px;display:flex;gap:7px;align-items:center;}
  .msg.ok{background:#EAF7EE;color:var(--ok);}
  .msg.bad{background:#FDECEC;color:var(--bad);}
  .msg.warn{background:#FFF4E0;color:var(--warn);}
  .center-box{max-width:400px;margin:60px auto;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .stat{background:#FAFBFE;border:1px solid var(--line);border-radius:10px;padding:14px;}
  .stat .n{font-size:22px;font-weight:800;color:var(--navy);}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px;}
  .empty{text-align:center;color:var(--muted);padding:26px;font-size:13px;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--navy);border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}
  .upload-box{border:1.5px dashed #C7CEDD;border-radius:9px;padding:14px;text-align:center;cursor:pointer;background:#FAFBFE;font-size:12.5px;}
  .row-actions{display:flex;gap:6px;}
  @media print{.no-print{display:none !important;}body{background:#fff;}}
  @media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}.topbar-inner{flex-direction:column;align-items:flex-start;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand-wrap">
      <img id="logo" src="" alt="PBG" />
      <div><div class="brand">POWERBRIDGE GLOBAL</div><div class="sub" id="portalLabel">HR PORTAL</div></div>
    </div>
    <div class="whoami hidden" id="whoami">
      <span class="badge" id="whoName"></span>
      <span id="whoRole" style="color:#B9C2D9;"></span>
      <button class="btn-ghost" onclick="logout()">Log out</button>
    </div>
  </div>
</div>

<div id="app"></div>

let session = null; // {empId, pin, name, role, department, accessLevel, view}
const $ = (id) => document.getElementById(id);

/* ---------------- API ---------------- */
function parseRes(res){
  return res.text().then(t=>{
    try { return JSON.parse(t); }
    catch(e){
      if(/^\s*<(!DOCTYPE|html)/i.test(t)) throw new Error("Server returned a login page — check the Apps Script deployment is set to \"Anyone\" and you're using the /exec URL.");
      throw new Error("Unexpected server response: " + t.slice(0,120));
    }
  });
}
function api(action, extra){
  // IMPORTANT: auth credentials (session.empId/pin) are applied LAST so that
  // a payload field like empId (which often names the *target* employee, e.g.
  // in setRole) can never overwrite the logged-in user's own credentials.
  // The target employee is passed as targetEmpId instead; see backend.
  const payload = Object.assign({action}, extra||{}, session ? {empId:session.empId, pin:session.pin} : {});
  return fetch(APPS_SCRIPT_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)}).then(parseRes);
}

/* ---------------- files ---------------- */
function fileToCompressed(file, cb){
  if(file.size > 8*1024*1024){ alert("File under 8MB please."); return; }
  if(!file.type.startsWith("image/")){ const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file); return; }
  const img=new Image(), rd=new FileReader();
  rd.onload=e=>{img.onload=()=>{const s=Math.min(1,1000/img.width);const c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72));};img.src=e.target.result;};
  rd.readAsDataURL(file);
}

/* ---------------- utils ---------------- */
function esc(s){ if(s==null) return ""; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function inr(n){ return "₹"+Number(n||0).toLocaleString("en-IN"); }
function fmtDate(v){ if(!v) return "—"; const d=new Date(v); return isNaN(d)?String(v):d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}); }
function statusPill(s){
  const t=String(s||"").toLowerCase();
  let cls="pending";
  if(t.includes("approved")) cls="approved";
  else if(t.includes("declined")) cls="declined";
  else if(t.includes("l2")) cls="l2";
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}

function doLogin(){
  const empId=$("loginId").value.trim().toUpperCase(), pin=$("loginPin").value.trim();
  if(!empId||!pin){ $("loginMsg").innerHTML=`<div class="msg bad">Enter both ID and PIN.</div>`; return; }

    enterPortal();

// Indian-format number to words (for the payslip amount in words)
function inWords(n){
  n=Math.round(Number(n)||0);
  if(n===0) return "Zero Rupees Only";
  const ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(x){ return x<20?ones[x]:tens[Math.floor(x/10)]+(x%10?" "+ones[x%10]:""); }
  function three(x){ return (x>=100?ones[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):""); }
  let out="";
  const crore=Math.floor(n/10000000); n%=10000000;
  const lakh=Math.floor(n/100000); n%=100000;
  const thou=Math.floor(n/1000); n%=1000;
  const rest=n;
  if(crore) out+=three(crore)+" Crore ";
  if(lakh) out+=three(lakh)+" Lakh ";
  if(thou) out+=three(thou)+" Thousand ";
  if(rest) out+=three(rest);
  return out.trim()+" Rupees Only";
}

/* Shared approvals renderer; isCEO toggles L2 view */
function loadApprovals(isCEO){
  const host = isCEO ? "ceoBody" : "apprBody";
  api("pendingApprovals").then(res=>{
    if(res.error){ $(host).innerHTML=`<div class="msg bad">${esc(res.error)}</div>`; return; }
    const stage = isCEO ? "Final (L2) approval" : "First-level (L1) approval";
    $(host).innerHTML=`
      <div class="card"><h3>Pending Leaves</h3>${leaveApprovalTable(res.leaves)}</div>
      <div class="card"><h3>Pending Salary Advances</h3><div class="csub">${stage}</div>${reqApprovalTable(res.advances,"advance",isCEO,"Amount")}</div>
      <div class="card"><h3>Pending Expenses</h3><div class="csub">${stage}. Handwritten proofs are flagged.</div>${expenseApprovalTable(res.expenses,isCEO)}</div>`;
  });
}
function leaveApprovalTable(rows){
  if(!rows||!rows.length) return `<div class="empty">No pending leaves.</div>`;
  return `<table><tr><th>Employee</th><th>Type</th><th>From→To</th><th>Days</th><th>Reason</th><th></th></tr>
  ${rows.map(r=>`<tr><td>${esc(r["Name"])}<br><span style="color:var(--muted)">${esc(r["Employee ID"])}</span></td><td>${esc(r["Leave Type"])}</td><td>${fmtDate(r["From"])} → ${fmtDate(r["To"])}</td><td>${esc(r["Days"])}</td><td>${esc(r["Reason"])}</td>
    <td class="row-actions"><button class="btn btn-ok" onclick="decide('leave','${r["Request ID"]}',true)">Approve</button><button class="btn btn-bad" onclick="decide('leave','${r["Request ID"]}',false)">Decline</button></td></tr>`).join("")}</table>`;
}
function reqApprovalTable(rows,kind,isCEO,amtCol){
  if(!rows||!rows.length) return `<div class="empty">Nothing pending.</div>`;
  return `<table><tr><th>Employee</th><th>Amount</th><th>Type / Terms</th><th>Reason</th><th>Over ₹20k</th><th>Stage</th><th></th></tr>
  ${rows.map(r=>{
    const terms = r["Advance Type"]==="Hand Loan" ? ("Hand Loan · return "+fmtDate(r["Return By Date"])) : (r["Advance Type"]==="EMI Deduction" ? ("EMI · "+esc(r["EMI Months"])+" mo") : esc(r["Advance Type"]||"—"));
    const over = r["Over Limit"]&&String(r["Over Limit"]).startsWith("YES");
    return `<tr><td>${esc(r["Name"])}<br><span style="color:var(--muted)">${esc(r["Employee ID"])}</span></td><td>${inr(r[amtCol])}</td><td>${terms}</td><td>${esc(r["Reason"])}</td>
    <td>${over?`<span class="pill declined" title="Signed by ${esc(r["Consent Signature"]||"")}">Yes ✍</span>`:'No'}</td><td>${statusPill(r["Status"])}</td>
    <td class="row-actions"><button class="btn btn-ok" onclick="decide('${kind}','${r["Request ID"]}',true)">${isCEO?"Final approve":"Approve (L1)"}</button><button class="btn btn-bad" onclick="decide('${kind}','${r["Request ID"]}',false)">Decline</button></td></tr>`;
  }).join("")}</table>`;
}
function expenseApprovalTable(rows,isCEO){
  if(!rows||!rows.length) return `<div class="empty">Nothing pending.</div>`;
  return `<table><tr><th>Employee</th><th>Amount</th><th>Category</th><th>Proof</th><th>Flag</th><th></th></tr>
  ${rows.map(r=>`<tr><td>${esc(r["Name"])}<br><span style="color:var(--muted)">${esc(r["Employee ID"])}</span></td><td>${inr(r["Amount"])}</td><td>${esc(r["Category"])}</td>
    <td>${r["Proof (Drive Link)"]?`<a href="${esc(r["Proof (Drive Link)"])}" target="_blank">View</a>`:"—"}</td>
    <td>${r["Handwritten Flag"]&&String(r["Handwritten Flag"]).startsWith("YES")?'<span class="pill declined">Handwritten</span>':'Printed'}</td>
    <td class="row-actions"><button class="btn btn-ok" onclick="decide('expense','${r["Request ID"]}',true)">${isCEO?"Final approve":"Approve (L1)"}</button><button class="btn btn-bad" onclick="decide('expense','${r["Request ID"]}',false)">Decline</button></td></tr>`).join("")}</table>`;
}
function decide(kind,requestId,approve){
  const note = approve ? "" : (prompt("Reason for declining (optional):")||"");
  api("decide",{kind,requestId,approve,note}).then(res=>{
    if(res.error){ alert(res.error); return; }
    if(session.view==="ceo") loadApprovals(true); else loadApprovals(false);
  });
}

function loadCeoPayslips(){
  const now=new Date();
  const defMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  api("allPayslips",{}).then(res=>{
    if(res.error){ $("ceoBody").innerHTML=`<div class="msg bad">${esc(res.error)}</div>`; return; }

    $("ceoBody").innerHTML=`

        <div class="grid2">
          <div><label class="fl">Month</label><input type="month" id="psMonth" value="${defMonth}" /></div>
          <div style="display:flex;align-items:flex-end;"><button class="btn btn-primary" onclick="genPayslips()">Generate payslips for this month</button></div>
        </div>

        `<table><tr><th>Month</th><th>Employee</th><th>Role</th><th>Basic</th><th>Net Pay</th><th></th></tr>

function genPayslips(){
  const month=$("psMonth").value;
  if(!month){ $("psMsg").innerHTML=`<div class="msg bad">Pick a month.</div>`; return; }
  $("psMsg").innerHTML=`<div class="msg"><span class="spinner"></span> Generating…</div>`;
  api("generatePayslips",{month}).then(res=>{
    if(res.error){ $("psMsg").innerHTML=`<div class="msg bad">${esc(res.error)}</div>`; return; }
    $("psMsg").innerHTML=`<div class="msg ok">✓ ${res.created} payslip(s) created for ${esc(monthLabel(res.month))}. ${res.alreadyExisted?res.alreadyExisted+" already existed. ":""}${res.skippedNoSalary?res.skippedNoSalary+" skipped (no salary set).":""}</div>`;
    setTimeout(loadCeoPayslips,1200);
  });
}

  api("formOptions").then(opts=>{
    if(opts.error){ $("ceoBody").innerHTML=`<div class="card"><div class="msg bad">${esc(opts.error)}</div></div>`; return; }
    const roleOpts = ['<option value="">Select role</option>'].concat(opts.roles.map(r=>`<option ${e.role===r?"selected":""}>${esc(r)}</option>`)).join("");
    const deptOpts = ["","Sales","Accounts","Warehouse","Procurement","Marketing","Management"].map(d=>`<option ${e.department===d?"selected":""}>${d}</option>`).join("");
    // Reporting manager dropdown = everyone at Lead+ access; exclude the person themselves.
    const mgrList = (opts.managers||[]).filter(m=>m.empId!==e.empId);

      .concat(mgrList.map(m=>{const label=`${m.name} (${m.role||m.accessLevel})`; return `<option value="${esc(label)}" ${e.reportingManager===label?"selected":""}>${esc(label)}</option>`;}))

    $("ceoBody").innerHTML=`<div class="card"><h3>Manage — ${esc(e.name)}</h3>
      <div class="csub">${esc(e.empId)}</div>

        <div><label class="fl">Role</label><select id="mRole">${roleOpts}</select></div>
        <div><label class="fl">Department</label><select id="mDept">${deptOpts}</select></div>

function openSalary(eJson){
  const e=JSON.parse(eJson);
  Promise.all([api("getCompensation",{targetEmpId:e.empId}), api("formOptions")]).then(([c,opts])=>{
    const comp=c.compensation||{};
    const mgrList=((opts&&opts.managers)||[]).filter(m=>m.empId!==e.empId);
    const preset = e.reportingManager || "Sashank (Founder/CEO)";
    const mgrOptions = mgrList.map(m=>{const label=`${m.name} (${m.role||m.accessLevel})`; return `<option value="${esc(label)}" ${preset===label?"selected":""}>${esc(label)}</option>`;}).join("");
    // Always include a CEO fallback + the preset even if not in the manager list.
    const fallback = `<option ${preset==="Sashank (Founder/CEO)"?"selected":""}>Sashank (Founder/CEO)</option>`;
    $("ceoBody").innerHTML=`<div class="card"><h3>Salary — ${esc(e.name)} <span style="font-size:11px;color:var(--muted)">🔒 Confidential</span></h3>
      <div class="csub">${esc(e.empId)} · ${esc(e.role||"role not set")}</div>

        <div><label class="fl">Basic Salary (Monthly ₹)</label><input type="number" id="sBasic" value="${esc(comp["Basic Salary (Monthly)"]||"")}" /></div>
        <div><label class="fl">Effective / Joining Date</label><input type="date" id="sDate" value="${esc(comp["Effective Date"]||"")}" /></div>
      </div>
      <label class="fl row-gap">Notes (internal, not shown on letter)</label><textarea id="sNotes">${esc(comp["Notes"]||"")}</textarea>
      <label class="fl row-gap">Reporting Manager (for letter)</label>
      <select id="sMgr">${fallback}${mgrOptions}</select>
      <div id="sMsg"></div>
      <div class="row-actions row-gap">
        <button class="btn btn-primary" onclick="saveComp('${e.empId}')">Save salary</button>
        <button class="btn btn-ok" onclick="genLetter('${e.empId}')">Generate offer/joining letter</button>
        <button class="btn btn-secondary" onclick="ceoTab='salary';renderCEO()">← Back</button>
      </div>
      <div class="msg warn" style="margin-top:12px;">Letter shows basic salary only — no HRA, allowances, or bonus. Review before issuing.</div>
    </div>
    <div id="letterHost"></div>`;
  });
}
function saveComp(empId){
  const b={targetEmpId:empId,basic:$("sBasic").value,effectiveDate:$("sDate").value,notes:$("sNotes").value};
  if(!(Number(b.basic)>0)){ $("sMsg").innerHTML=`<div class="msg bad">Enter a valid basic salary.</div>`; return; }
  $("sMsg").innerHTML=`<div class="msg"><span class="spinner"></span> Saving…</div>`;
  api("setCompensation",b).then(res=>{ $("sMsg").innerHTML=res.error?`<div class="msg bad">${esc(res.error)}</div>`:`<div class="msg ok">✓ Saved.</div>`; });
}
function genLetter(empId){
  const mgr=$("sMgr").value, jd=$("sDate").value;
  api("generateLetter",{targetEmpId:empId,reportingManager:mgr,joiningDate:jd}).then(res=>{
    if(res.error){ $("sMsg").innerHTML=`<div class="msg bad">${esc(res.error)}</div>`; return; }
    renderLetter(res.letter);
  });
}
function renderLetter(L){
  $("letterHost").innerHTML=`
    <div class="no-print" style="display:flex;justify-content:flex-end;margin:12px 0;"><button class="btn btn-primary" onclick="window.print()">🖨 Print / Save as PDF</button></div>
    <div class="card" id="letterPaper" style="padding:40px 46px;">
      <div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--gold);padding-bottom:14px;margin-bottom:22px;">
        <img src="${LOGO_SRC}" style="width:52px;height:52px;border-radius:50%;" />
        <div><div style="font-weight:900;font-size:19px;color:var(--navy);">POWERBRIDGE GLOBAL</div>
        <div style="font-size:10.5px;color:var(--gold-deep);font-weight:700;letter-spacing:1px;">ELECTRICAL WHOLESALE &amp; DISTRIBUTION</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#4B5568;margin-bottom:18px;"><div>Date: ${fmtDate(new Date().toISOString())}</div><div>Ref: ${esc(L.empId)}</div></div>
      <h2 style="text-align:center;color:var(--navy);text-decoration:underline;font-size:16px;margin-bottom:20px;">OFFER &amp; JOINING LETTER</h2>
      <p style="font-size:13px;line-height:1.8;">Dear <b>${esc(L.name)}</b>,</p>
      <p style="font-size:13px;line-height:1.8;">We are pleased to confirm your appointment with <b>PowerBridge Global</b> as <b>${esc(L.role)}</b>${L.department?" in the "+esc(L.department)+" team":""}, reporting to <b>${esc(L.reportingManager)}</b>. Your date of joining will be <b>${fmtDate(L.joiningDate)}</b>.</p>
      <table style="width:100%;border-collapse:collapse;margin:16px 0;font-size:12.5px;">
        ${letterRow("Employee ID",L.empId)}${letterRow("Designation",L.role)}${letterRow("Department",L.department||"—")}
        ${letterRow("Date of Joining",fmtDate(L.joiningDate))}${letterRow("Reporting Manager",L.reportingManager)}
        ${letterRow("Basic Salary (Monthly)",inr(L.basic),true)}${letterRow("Notice Period",(L.noticeDays||"—")+" days")}
      </table>
      <p style="font-size:11.5px;line-height:1.8;color:#4B5568;">The above reflects your basic salary only at the time of joining. Any allowances, incentives, or bonus are discretionary, not guaranteed, and communicated separately at management's discretion — they do not form part of this letter.</p>
      <p style="font-size:11.5px;line-height:1.8;color:#4B5568;">Your employment is subject to the PowerBridge Global Employee Handbook, including Code of Conduct, Notice Period, and Confidentiality terms.</p>
      <div style="margin-top:44px;display:flex;justify-content:space-between;align-items:flex-end;">
        <div><p style="font-size:12.5px;margin:0;">For <b>PowerBridge Global</b>,</p><div style="height:60px;"></div>
          <div style="font-size:12.5px;font-weight:800;color:var(--navy);">Sashank</div><div style="font-size:11px;color:var(--muted);">Founder &amp; CEO</div></div>
        <div style="text-align:center;font-size:11px;color:var(--muted);"><div style="border-top:1px solid #1F2937;width:150px;margin-bottom:5px;"></div>Employee Signature<br>(Acceptance)</div>
      </div>
    </div>`;
  window.scrollTo(0,document.body.scrollHeight);
}
function letterRow(l,v,hl){ return `<tr style="background:${hl?'#FCECC0':'transparent'}"><td style="padding:6px 9px;font-weight:700;color:var(--navy);border:1px solid var(--line);width:40%;">${esc(l)}</td><td style="padding:6px 9px;border:1px solid var(--line);">${esc(v)}</td></tr>`; }

function loadAttendanceTab(){
  $("ceoBody").innerHTML=`<div class="card"><h3>Attendance / Payroll <span style="font-size:11px;color:var(--muted)">Essl import</span></h3>
    <div class="csub">Upload your monthly Essl login/logout CSV. Rows are stored now; the salary-calculation rules will be added once we finalise them from a sample report.</div>
    <div class="grid2">
      <div><label class="fl">Report month</label><input type="month" id="attMonth" /></div>
      <div><label class="fl">Essl CSV file</label><input type="file" id="attFile" accept=".csv" /></div>
    </div>
    <div id="attMsg"></div>
    <button class="btn btn-primary row-gap" onclick="importAttendance()">Import CSV</button>
    <div class="msg warn" style="margin-top:12px;">⏳ Salary calculation from attendance is set up but intentionally paused — share a sample Essl CSV and we'll write the calculation rules against its real columns.</div>
  </div>`;
}
function importAttendance(){
  const file=$("attFile").files[0], month=$("attMonth").value;
  if(!file){ $("attMsg").innerHTML=`<div class="msg bad">Choose a CSV file.</div>`; return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const text=reader.result;
    const rows=text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(","));
    $("attMsg").innerHTML=`<div class="msg"><span class="spinner"></span> Importing ${rows.length} rows…</div>`;
    api("importAttendance",{month:month||"",rows}).then(res=>{
      $("attMsg").innerHTML=res.error?`<div class="msg bad">${esc(res.error)}</div>`:`<div class="msg ok">✓ Stored ${res.stored} rows for ${esc(res.month)}. ${esc(res.note||"")}</div>`;
    });
  };
  reader.readAsText(file);
}

/* ---------------- init ---------------- */
if(APPS_SCRIPT_URL.indexOf("PASTE_YOUR")===0){
  $("app").innerHTML=`<div class="center-box"><div class="card"><div class="msg bad">⚠ Set APPS_SCRIPT_URL at the top of the script before deploying.</div></div></div>`;
} else {
  renderLogin();
}
</script>
